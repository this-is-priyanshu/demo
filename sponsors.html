<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ title or "Sponsors" }}</title>

    <link rel="stylesheet" href="static/home.css" />
    <link rel="stylesheet" href="static/events.css" />
    <link rel="stylesheet" href="static/sponsors.css" />
    <link rel="stylesheet" href="static/components/navbar.css" />
  </head>
  <body>
    <!-- Placeholder logo (top-left) -->
    <a href="index.html" class="logo-placeholder">LOGO</a>

    <!-- Hamburger button (top-right) -->
    <button id="menuToggle" class="menu-toggle" aria-label="Open menu" aria-expanded="false">
      <svg id="menuIcon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M4 6h16M4 12h16M4 18h16"></path>
      </svg>
      <svg id="closeIcon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="opacity:0; visibility:hidden;">
        <path d="M18 6L6 18M6 6l12 12"></path>
      </svg>
    </button>

    <!-- Menu overlay -->
    <div id="mainMenu" class="menu-overlay" aria-hidden="true">
      <div id="menuPanel" class="menu-panel" role="dialog" aria-modal="true" aria-label="Main menu">
        <button id="panelClose" class="panel-close" aria-label="Close menu">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M18 6L6 18M6 6l12 12"></path>
          </svg>
        </button>

        <nav class="panel-nav" aria-label="Primary">
          <a href="#" class="panel-link" style="font-size: 20px;">x-cryptus</a>
          <a href="#" class="panel-link" style="font-size: 20px;">sponsors</a>
          <a href="#" class="panel-link" style="font-size: 20px;">about-us</a>
          <a href="#" class="panel-link" style="font-size: 20px;">contact-us</a>
        </nav>

      </div>
    </div>

    <!--
    <header>{{ header }}</header>
    -->

    <canvas id=background style="
    position: fixed;
    left: 0px;
    top: 0px;
    width: 100%;
    height: 100%;
    display: block;
    filter: blur(4px) brightness(0.4);
    z-index: -1;"></canvas>

    <!-- Centered hero with plain 'sponsors' word (full-width) -->
    <section class="section">
      <div class="hero-events">sponsors</div>
    </section>

    <section class="intro-section">
      <p>We are grateful to our sponsors for their support.</p>
    </section>

    <!-- Sponsors Carousel Section -->
    <section class="sponsors-carousel-container">
      <div class="carousel">
        <div class="carousel-nav" id="prevBtn">l</div>
        
        <div class="carousel-content" id="carouselContent">
          <!-- Sponsor items will be generated here by JavaScript -->
        </div>

        <div class="carousel-nav" id="nextBtn">r</div>
      </div>
    </section>

    <!-- GSAP (for menu animations) -->
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"
      integrity="sha512-NcZdtrT77bJr4STcmsGAESr06BYGE8woZdSdEgqnpyqac7sugNO+Tr4bGwGF3MsnEkGKhU2KL2xh6Ec+BqsaHA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>
    <script src="static/home.js"></script>
    <script src="static/sponsors.js"></script>

    <!-- Background Effects -->
    <script type="importmap">
        {
            "imports" : {
                  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    <script src="static/3d-sea.js" type=module></script>
  </body>
</html>
